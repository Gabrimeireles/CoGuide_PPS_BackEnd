name: Backend - Deploy to Homologation

on:
  release:
    types: [published, prereleased]
  workflow_dispatch:
    inputs:
      image_tag:
        description: v0.1.0
        required: true
      skip_health_check:
        description: Skip health check
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: backend-deploy-homologation
  cancel-in-progress: false

jobs:
  deploy_release:
    if: ${{ github.event_name == 'release' && github.event.release.target_commitish == 'homologation' }}
    uses: Gabrimeireles/reusable-workflows/.github/workflows/docker-deploy-ssh.yml@v1.7
    with:
      deploy_environment: homologation
      deploy_path: ${{ vars.DEPLOY_PATH }}
      service_name: api
      compose_env_file: .env
      runtime_env_filename: .env.backend
      api_image: ghcr.io/gabrimeireles/coguide-api
      api_tag: ${{ github.event.release.tag_name }}
      health_url: ${{ vars.HEALTH_URL }}
      health_retries: 10
      health_interval: 30
      skip_health_check: false
      use_tailscale: true
    secrets: inherit

  deploy_manual:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    uses: Gabrimeireles/reusable-workflows/.github/workflows/docker-deploy-ssh.yml@v1.7
    with:
      deploy_environment: homologation
      deploy_path: ${{ vars.DEPLOY_PATH }}
      service_name: api
      compose_env_file: .env
      runtime_env_filename: .env.backend
      api_image: ghcr.io/gabrimeireles/coguide-api
      api_tag: ${{ github.event.inputs.image_tag }}
      health_url: ${{ vars.HEALTH_URL }}
      health_retries: 10
      health_interval: 30
      skip_health_check: ${{ github.event.inputs.skip_health_check == 'true' }}
      use_tailscale: true
    secrets: inherit
