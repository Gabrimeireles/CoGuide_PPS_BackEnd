name: Backend - Deploy to Homologation

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      image_tag:
        description: v0.1.0
        required: true
      skip_health_check:
        description: Skip health check
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: backend-deploy-homologation
  cancel-in-progress: false

jobs:
  deploy:
    uses: Gabrimeireles/reusable-workflows/.github/workflows/docker-deploy-ssh.yml@v1.3
    with:
      deploy_environment: homologation
      deploy_path: ${{ vars.DEPLOY_PATH }}
      service_name: api
      compose_env_file: .env
      runtime_env_filename: .env.backend
      api_image: ghcr.io/${{ github.repository_owner }}/CoGuide_PPS_BackEnd
      api_tag: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.image_tag }}
      health_url: ${{ vars.HEALTH_URL }}
      health_retries: 10
      health_interval: 30
      skip_health_check: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.skip_health_check == 'true' || false }}
      use_tailscale: true
    secrets: inherit


