name: Backend - Deploy to Homologation

on:
  workflow_run:
    workflows: ["Backend - Create Release"]
    types: [completed]
    branches: [homologation]
  workflow_dispatch:
    inputs:
      image_tag:
        description: v0.1.0
        required: true
      skip_health_check:
        description: Skip health check
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: backend-deploy-homologation
  cancel-in-progress: false

jobs:
  resolve_release_tag:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Resolve release tag from package version
        id: resolve
        run: |
          set -euo pipefail
          VERSION="$(jq -r '.version' package.json)"
          if [ -z "${VERSION}" ] || [ "${VERSION}" = "null" ]; then
            echo "Could not resolve package.json version"
            exit 1
          fi

          echo "release_tag=v${VERSION}" >> "${GITHUB_OUTPUT}"

  deploy_release:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
    needs: [resolve_release_tag]
    uses: Gabrimeireles/reusable-workflows/.github/workflows/docker-deploy-ssh.yml@v1.7
    with:
      deploy_environment: homologation
      deploy_path: ${{ vars.DEPLOY_PATH }}
      service_name: api
      compose_env_file: .env
      runtime_env_filename: .env.backend
      api_image: ghcr.io/gabrimeireles/coguide-api
      api_tag: ${{ needs.resolve_release_tag.outputs.release_tag }}
      health_url: ${{ vars.HEALTH_URL }}
      health_retries: 10
      health_interval: 30
      skip_health_check: false
      use_tailscale: true
    secrets: inherit

  deploy_manual:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    uses: Gabrimeireles/reusable-workflows/.github/workflows/docker-deploy-ssh.yml@v1.7
    with:
      deploy_environment: homologation
      deploy_path: ${{ vars.DEPLOY_PATH }}
      service_name: api
      compose_env_file: .env
      runtime_env_filename: .env.backend
      api_image: ghcr.io/gabrimeireles/coguide-api
      api_tag: ${{ github.event.inputs.image_tag }}
      health_url: ${{ vars.HEALTH_URL }}
      health_retries: 10
      health_interval: 30
      skip_health_check: ${{ github.event.inputs.skip_health_check == 'true' }}
      use_tailscale: true
    secrets: inherit
