name: Backend - Deploy to Homologation

on:
  release:
    types: [published, prereleased]
  workflow_dispatch:
    inputs:
      image_tag:
        description: v0.1.0
        required: true
      skip_health_check:
        description: Skip health check
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-deploy-homologation
  cancel-in-progress: false

jobs:
  retag_release_image:
    if: ${{ github.event_name == 'release' && github.event.release.target_commitish == 'homologation' }}
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag homologation image to release tag
        run: |
          SOURCE_IMAGE="ghcr.io/gabrimeireles/coguide-api:homologation"
          TARGET_IMAGE="ghcr.io/gabrimeireles/coguide-api:${{ github.event.release.tag_name }}"
          docker buildx imagetools create -t "${TARGET_IMAGE}" "${SOURCE_IMAGE}"

  deploy_release:
    if: ${{ github.event_name == 'release' && github.event.release.target_commitish == 'homologation' }}
    needs: [retag_release_image]
    uses: Gabrimeireles/reusable-workflows/.github/workflows/docker-deploy-ssh.yml@v1.7
    with:
      deploy_environment: homologation
      deploy_path: ${{ vars.DEPLOY_PATH }}
      service_name: api
      compose_env_file: .env
      runtime_env_filename: .env.backend
      api_image: ghcr.io/gabrimeireles/coguide-api
      api_tag: ${{ github.event.release.tag_name }}
      health_url: ${{ vars.HEALTH_URL }}
      health_retries: 10
      health_interval: 30
      skip_health_check: false
      use_tailscale: true
    secrets: inherit

  deploy_manual:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    uses: Gabrimeireles/reusable-workflows/.github/workflows/docker-deploy-ssh.yml@v1.7
    with:
      deploy_environment: homologation
      deploy_path: ${{ vars.DEPLOY_PATH }}
      service_name: api
      compose_env_file: .env
      runtime_env_filename: .env.backend
      api_image: ghcr.io/gabrimeireles/coguide-api
      api_tag: ${{ github.event.inputs.image_tag }}
      health_url: ${{ vars.HEALTH_URL }}
      health_retries: 10
      health_interval: 30
      skip_health_check: ${{ github.event.inputs.skip_health_check == 'true' }}
      use_tailscale: true
    secrets: inherit

