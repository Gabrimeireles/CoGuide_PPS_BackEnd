name: Backend - Deploy to Homologation

on:
  workflow_run:
    workflows: ["Backend - Create Release"]
    types: [completed]
    branches: [homologation]
  workflow_dispatch:
    inputs:
      image_tag:
        description: v0.1.0
        required: true
      skip_health_check:
        description: Skip health check
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: backend-deploy-homologation
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    uses: Gabrimeireles/reusable-workflows/.github/workflows/docker-deploy-ssh.yml@v1.7
    with:
      deploy_environment: homologation
      deploy_path: ${{ vars.DEPLOY_PATH }}
      service_name: api
      compose_env_file: .env
      runtime_env_filename: .env.backend
      api_image: ghcr.io/gabrimeireles/coguide-api
      api_tag: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.event.inputs.image_tag }}
      health_url: ${{ vars.HEALTH_URL }}
      health_retries: 10
      health_interval: 30
      skip_health_check: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.skip_health_check == 'true' || false }}
      use_tailscale: true
    secrets: inherit


