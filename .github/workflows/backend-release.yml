name: Backend - Create Release

on:
  workflow_run:
    workflows: ["Backend - Update Swagger Docs"]
    types: [completed]
    branches: [master, dev, homologation]
  workflow_dispatch:
    inputs:
      release_version:
        description: Version without v prefix (optional)
        required: false
        default: ''

permissions:
  contents: write
  packages: write

jobs:
  release:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    uses: Gabrimeireles/reusable-workflows/.github/workflows/github-release.yml@v1.5
    with:
      ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      release_version: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_version || '' }}
      prerelease: ${{ github.event_name != 'workflow_dispatch' && github.event.workflow_run.head_branch != 'master' }}
    secrets: inherit

  publish_version_image:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - name: Check out target commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve release tag from package version
        id: resolve
        env:
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          VERSION="$(jq -r '.version' package.json)"
          if [ -z "${VERSION}" ] || [ "${VERSION}" = "null" ]; then
            echo "Could not resolve package.json version"
            exit 1
          fi

          echo "release_tag=v${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "target_sha=${TARGET_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish semver image tag
        env:
          TARGET_SHA: ${{ steps.resolve.outputs.target_sha }}
          RELEASE_TAG: ${{ steps.resolve.outputs.release_tag }}
        run: |
          set -euo pipefail
          SHORT_SHA="${TARGET_SHA:0:7}"
          SOURCE_IMAGE="ghcr.io/gabrimeireles/coguide-api:sha-${SHORT_SHA}"
          TARGET_IMAGE="ghcr.io/gabrimeireles/coguide-api:${RELEASE_TAG}"

          docker buildx imagetools create -t "${TARGET_IMAGE}" "${SOURCE_IMAGE}"
