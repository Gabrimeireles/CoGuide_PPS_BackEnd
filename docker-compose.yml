services:
  api:
    image: ${API_IMAGE:-coguide-api}:${API_TAG:-local}
    container_name: coguide-api
    restart: unless-stopped
    env_file:
      - .env.backend
    environment:
      PORT: 3000
      DB_URI: mongodb://mongo:27017/coguide
      RAG_CHROMA_URL: http://chroma:8000
      OLLAMA_BASE_URL: http://ollama:11434
      RAG_RAW_DIR: storage/raw
    volumes:
      - ./storage/raw:/app/storage/raw
    ports:
      - "127.0.0.1:${API_HOST_PORT:-3002}:3000"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s

  mongo:
    image: mongo:7
    container_name: coguide-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' | grep 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 20s

  chroma:
    image: chromadb/chroma:0.5.23
    container_name: coguide-chroma
    restart: unless-stopped
    volumes:
      - chroma_data:/chroma/chroma

  ollama:
    image: ollama/ollama:latest
    container_name: coguide-ollama
    restart: unless-stopped
    profiles: ["local-embeddings"]
    volumes:
      - ollama_data:/root/.ollama

  ollama-pull:
    image: ollama/ollama:latest
    container_name: coguide-ollama-pull
    restart: "no"
    profiles: ["local-embeddings"]
    depends_on:
      - ollama
    entrypoint: ["/bin/sh", "-c"]
    command: >
      until ollama list >/dev/null 2>&1; do
        echo "Waiting for ollama service...";
        sleep 2;
      done;
      ollama pull ${RAG_OLLAMA_EMBEDDING_MODEL:-all-minilm};
    environment:
      OLLAMA_HOST: http://ollama:11434

volumes:
  mongo_data:
  chroma_data:
  ollama_data:
